[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #89b4fa

[bar/soundbar_test]
bottom = true
width = 100%
height = 24pt
radius = 10
background = #1a1a1a66
foreground = ${colors.foreground}
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=10;2"
modules-center = cava
enable-ipc = true

[module/cava]
type = custom/script
exec = ~/.config/polybar/scripts/soundbar.sh
tail = true
format = <label>
label = %output%
format-foreground = ${colors.foreground}
format-font = 0
