[package]
name = "soundbar"
version = "0.1.0"
edition = "2021"
description = "Audio spectrum visualizer for polybar: cava-style raw output in Rust (fork de lookas)"

[dependencies]
anyhow = "1.0"
cpal = "0.15"
dirs = "5.0"
realfft = "3.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
